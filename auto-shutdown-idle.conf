# ==============================================================================
# auto-shutdown-idle.conf - 自動シャットダウン設定ファイル
# ==============================================================================
#
# このファイルは auto-shutdown-idle.sh から読み込まれます。
# 変更後、cronの次回実行時から反映されます。
#

# ------------------------------------------------------------------------------
# SSHユーザー監視設定
# ------------------------------------------------------------------------------

# SSHユーザーのアイドル監視を有効にするか (true / false)
USER_MONITOR_ENABLED=false

# ユーザーのアイドル時間閾値（秒）
# この秒数以上アイドルならシャットダウン対象
# 例: 60=1分, 180=3分, 300=5分, 600=10分, 1800=30分, 3600=1時間
USER_IDLE_THRESHOLD_SECONDS=180

# ------------------------------------------------------------------------------
# Claude監視設定
# ------------------------------------------------------------------------------

# Claude Codeの監視を有効にするか (true / false)
CLAUDE_MONITOR_ENABLED=true

# Claudeのアイドル時間閾値（秒）
# Claude関連ファイルがこの秒数以上更新されていなければアイドルとみなす
# 例: 60=1分, 180=3分, 300=5分
CLAUDE_IDLE_THRESHOLD_SECONDS=180

# 監視対象のClaude関連ディレクトリ
# debugディレクトリはClaude処理中に常時更新されるため最適
CLAUDE_WATCH_PATHS="$HOME/.claude/debug"

# ------------------------------------------------------------------------------
# シャットダウン条件
# ------------------------------------------------------------------------------
#
# シャットダウンは以下の条件をすべて満たす場合に実行されます：
#
# 1. USER_MONITOR_ENABLED=true の場合:
#    - 全SSHセッションが USER_IDLE_THRESHOLD_SECONDS 以上アイドル
#    - または SSHセッションがない
#
# 2. CLAUDE_MONITOR_ENABLED=true の場合:
#    - Claudeプロセスが存在しない
#    - または Claude関連ファイルが CLAUDE_IDLE_THRESHOLD_SECONDS 以上更新されていない
#
# どちらかの監視が false の場合、その条件はスキップされます。
# 両方 false の場合、シャットダウンは実行されません（安全のため）。
#
